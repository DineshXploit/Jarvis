# JARVIS local development compose.
#
# Two services, deliberately:
#   searxng         local web-search backend (pre-existing, unchanged)
#   jarvis-backend  the cloud backend, added for local testing of the container
#
# The compose file is for LOCAL USE ONLY. Render builds straight from the
# Dockerfile and does not use compose.
#
#   docker compose up -d searxng jarvis-backend    start
#   docker compose down --remove-orphans           stop
#   docker compose logs -f jarvis-backend          tail
#
# Note: the backend reads NVIDIA_API_KEY from your shell environment or a .env
# file next to this file. Never commit a populated .env.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=jarvis
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  jarvis-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Overridden by the platform in production; set explicitly here.
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Pass-through from the host shell. `env_file` is deliberately not used
      # so a developer's .env cannot be copied into an image layer.
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-openai/gpt-oss-20b}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - TELEMETRY_LEVEL=${TELEMETRY_LEVEL:-info}
    # Named volume: telemetry and the improvement ledger must survive
    # `docker compose down`, otherwise every restart loses the history the
    # self-improvement subsystem reasons over.
    volumes:
      - jarvis-data:/app/data
    depends_on:
      - searxng

volumes:
  jarvis-data: